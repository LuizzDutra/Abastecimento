[project]
name = "abastecimentochallenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "sqlalchemy>=2.0.49",
]


[tool.ruff]
# Target Python version
target-version = "py310"
# Set the maximum line length (matches Black's default)
line-length = 88

[tool.ruff.lint]
# Enable specific rule categories
# E/W = Pycodestyle (errors/warnings), F = Pyflakes, I = Isort (import sorting)
select = ["E", "W", "F", "I"]
ignore = []

# Allow fixable violations to be automatically fixed
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use profile defaults that mimic Black
quote-style = "double"
indent-style = "space"
